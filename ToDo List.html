<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset=" UTF-8">
    <title>ToDo list</title>

    <style>

        body {
            background: #1f2937;
            color: white;
            text-align: center;
            font-family: Arial;
 



        }

        h1{
            color: gold;

        }

        input{
            width: 350px;
            padding: 15px;
            border-radius: 10px;
            font-size: 20px;
        }

        button{
            padding: 15px 25px;
            margin: 10px;
            background: gold;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        li {
            font-size: 24px;
            margin: 10px;
        }

            #list {
                list-style:none;
                padding: 0;
        }

        #list li {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            font-size: 35px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>📝 ToDo list</h1>

    <input type="text" id="task" placeholder="Введите задачу">

    <button onclick="addTask()">Добавить</button>
    <h2 id="count">📄 Всего задач: 0</h2>
    <ul id="list"></ul>

    <script>

        function addTask() {

            let task = 
            document.getElementById("task").value;

            if (task.trim() === "") {
                return;
            }

            let li = 
            document.createElement("li");

            li.textContent = task;
            let button = document.createElement("button");
            button.textContent = "❌";

            button.addEventListener("click", function () {
                li.remove();
                updateCount();
                saveTasks();
            });

            li.appendChild(button);

            document.getElementById("list").appendChild(li);
            document.getElementById("task").value = "";

            updateCount();

            saveTasks();

        }

            function updateCount(){

        let count = 
        document.querySelectorAll("#list li").length;

        document.getElementById("count").innerHTML = 
        "📄 Всего задач: " + count;
            }

            function saveTasks() {

                let tasks = document.getElementById("list").innerHTML;
                localStorage.setItem("tasks", tasks);
            }

            document.getElementById("list").innerHTML = 
            localStorage.getItem("tasks");

            updateCount();

            document.querySelectorAll("#list button").forEach(function(button) {
            
                button.onclick = function() {
                    button.parentElement.remove();
                    updateCount();
                    saveTasks();
                };
            });

    </script>
</body>
</html>
